name: Selective visibility
on:
  pull_request:
  push:
    branches: [feature/selective-file-visibility]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e . pytest
      - run: pytest --noconftest tests/test_visibility.py
